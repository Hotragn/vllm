name: fork-bench-mm-processor

# Fork-only. Runs the REAL `vllm bench mm-processor` A/B for PR #54283
# ("Frame the multi-modal hash digest input") on a CPU build of vLLM.
#
# Why this is possible without a GPU: vLLM publishes pre-built CPU wheels, and
# `vllm bench mm-processor` only needs an engine to exist -- the stage this PR
# touches (`get_mm_hashes`) is pure CPU work either way. The only stage that
# genuinely needs a GPU is `encoder_forward`, which this diff does not touch.
#
# Why the A/B is a single-file swap: the PR changes exactly ONE runtime file,
# vllm/multimodal/hasher.py (the other two are tests). Both sides therefore
# share one install and one model download. The workflow HARD-FAILS if that
# stops being true.
#
# Measurement discipline is carried over from the GPU runbook so a later GPU run
# is directly comparable: repeat 0 is a discarded warmup, measured repeats
# ALTERNATE which side runs first, --seed is fixed, and the summary prints a
# noise floor (main against itself) plus a same-work check.

# workflow_dispatch only registers from the default branch, and this file must
# stay OFF the fork's main (it would leak into every PR diff). So it is driven by
# pushing this branch, restricted to this workflow's own paths so an unrelated
# test-plan push does not spend an hour here.
on:
  push:
    branches:
      - ci/test-runner
    paths:
      - .github/workflows/fork-bench-mm-processor.yml
      - .github/bench/summarize_mm_processor.py

env:
  # Flip to "false" and push to run the full A/B; "true" stops after the probe.
  # The smoke step always runs, so it stays a fast gate on the full run.
  # Left at "true" on purpose: evidence is banked (run 35315243142). Flip to
  # "false" only when you actually want another ~78 min A/B.
  SMOKE_ONLY: "true"
  MODEL: HuggingFaceTB/SmolVLM-256M-Instruct
  # Sized from the first full run: one invocation is ~240 s (fp32 cut the CPU
  # encoder from 154 s to ~39 s/request), so 5 measured repeats fit comfortably.
  # 2 repeats left the hashing delta inside main's own spread, which is exactly
  # the case where more repeats -- not more prompts -- buys resolution.
  REPEATS: "5"
  NUM_PROMPTS: "6"
  # float32, not bfloat16: this runner has no AMX/avx512-bf16, so bf16 is
  # emulated and the vision tower crawls.
  DTYPE: float32
  # NOTE: do_image_splitting=false would cut the irrelevant encoder cost, but it
  # trips a real vLLM bug in Idefics3 -- "cannot reshape tensor of 0 elements
  # into shape [0, -1]" at idefics3.py:630. Not this PR's business, so the
  # encoder stays expensive and the sample stays small instead.
  # PR #54283 branch head and its merge-base with upstream/main.
  BRANCH_HEAD: 3da5f95ccd72399a9892be3c258bc7f95678766e
  BASE: 30b847c1fa5461a590606cbc9b8dae4a490c6cdd
  TARGET: vllm/multimodal/hasher.py

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift || true
          df -h /

      - name: Runner CPU
        run: |
          lscpu | tee /tmp/cpu.txt
          echo "---- flags of interest ----"
          grep -o 'avx512[a-z0-9_]*\|avx2' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          free -g

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the PR branch and its base
        run: |
          set -euxo pipefail
          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/vllm-project/vllm.git
          git fetch --no-tags origin "$BRANCH_HEAD"
          git fetch --no-tags upstream "$BASE"

      - name: Guard -- the PR must still change exactly one runtime file
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE" "$BRANCH_HEAD" -- 'vllm/**' | tr -d '\r')
          echo "runtime files changed by the PR: [$changed]"
          if [ "$changed" != "$TARGET" ]; then
            echo "::error::expected only $TARGET under vllm/, got: $changed"
            echo "The single-file swap A/B is no longer faithful. Stopping."
            exit 1
          fi

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install vLLM (pre-built CPU wheel -- no build, no GPU)
        run: |
          set -euxo pipefail
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          uv pip install vllm \
            --extra-index-url https://wheels.vllm.ai/nightly/cpu \
            --index-strategy first-index --torch-backend cpu
          uv pip install pandas datasets
          # Import from OUTSIDE the checkout: the repo root contains a `vllm/`
          # package and `python -c` puts cwd first on sys.path, so importing here
          # would silently pick up the SOURCE TREE instead of the wheel -- mixing
          # source Python with the wheel's compiled extensions.
          cd "$RUNNER_TEMP"
          python -c "import vllm; print('vllm', vllm.__version__)"

      - name: Locate the swap target inside site-packages
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/venv/bin/activate"
          # The wheel is NOT editable, so the swap target is the installed copy.
          # Resolve it from the imported module rather than guessing -- but from
          # $RUNNER_TEMP, not the checkout (see the note in the install step).
          # vLLM logs to stdout on import, so tag the line and filter for it.
          INSTALLED=$(cd "$RUNNER_TEMP" && python -c \
            'import vllm.multimodal.hasher as h; print("HASHER_PATH=" + h.__file__)' \
            | sed -n 's/^HASHER_PATH=//p' | tail -1)
          echo "installed hasher: $INSTALLED"
          test -f "$INSTALLED"
          # HARD GUARD: the whole method rests on swapping the file that vllm
          # actually imports. If this resolves into the workspace, the wheel is
          # being shadowed by the checkout and every number would be meaningless.
          case "$INSTALLED" in
            "$RUNNER_TEMP"/venv/*) echo "resolves into the venv: OK" ;;
            *) echo "::error::hasher resolved to '$INSTALLED', outside the venv"; exit 1 ;;
          esac
          echo "INSTALLED_HASHER=$INSTALLED" >> "$GITHUB_ENV"
          # Intel OpenMP must be preloaded for the CPU wheel.
          IOMP=$(find "$RUNNER_TEMP/venv" -name 'libiomp5.so' | head -1 || true)
          if [ -n "$IOMP" ]; then
            echo "LD_PRELOAD=$IOMP" >> "$GITHUB_ENV"
            echo "preloading $IOMP"
          else
            echo "no libiomp5.so found; continuing without LD_PRELOAD"
          fi

      - name: Extract both revisions of the swapped file
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          git show "$BASE:$TARGET"        > "$OUT/hasher.main.py"
          git show "$BRANCH_HEAD:$TARGET" > "$OUT/hasher.branch.py"
          if cmp -s "$OUT/hasher.main.py" "$OUT/hasher.branch.py"; then
            echo "::error::the two revisions are identical -- wrong BASE?"
            exit 1
          fi
          wc -l "$OUT/hasher.main.py" "$OUT/hasher.branch.py"
          # The installed wheel is built from an older main than BASE. That is
          # fine for an A/B (both sides run on the same wheel), but the BASE file
          # must still import cleanly against it -- checked in the smoke step.
          echo "wheel's own copy vs BASE copy:"
          diff -u "$INSTALLED_HASHER" "$OUT/hasher.main.py" | head -40 || true

      - name: Smoke test -- can this wheel serve the model at all?
        env:
          VLLM_CPU_KVCACHE_SPACE: "4"
          VLLM_LOGGING_LEVEL: INFO
          # A CPU forward is far slower than the 300 s default RPC budget, and
          # the multiproc executor turns that into "RPC call to execute_model
          # timed out". Run the engine core in-process so there is no RPC at
          # all, and raise the budget anyway.
          VLLM_ENABLE_V1_MULTIPROCESSING: "0"
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/venv/bin/activate"
          # Everything below must run outside the checkout so the wheel, not the
          # source tree, is what gets imported and benchmarked.
          cd "$RUNNER_TEMP"

          # Is the file swap actually LIVE? Use the PR's own headline collision:
          # {"ab": "c"} and {"a": "bc"} both flatten to b"ab" + b"c" on main and
          # must separate on the branch. If these two probes agree, the swap is a
          # no-op and every timing below would be measuring one revision twice.
          swap() {
            cp -f "$OUT/hasher.$1.py" "$INSTALLED_HASHER"
            find "$(dirname "$INSTALLED_HASHER")" -name '__pycache__' -type d \
              -prune -exec rm -rf {} + 2>/dev/null || true
          }
          probe() {
            python -c "
          from vllm.multimodal.hasher import MultiModalHasher as H
          a = H.hash_kwargs('blake3', **{'ab': 'c'})
          b = H.hash_kwargs('blake3', **{'a': 'bc'})
          print('PROBE=' + ('EQUAL' if a == b else 'DIFFER'))
          " | sed -n 's/^PROBE=//p' | tail -1
          }
          swap main;   base_probe=$(probe)
          swap branch; branch_probe=$(probe)
          echo "collision probe:  base=$base_probe  branch=$branch_probe"
          if [ "$base_probe" != "EQUAL" ] || [ "$branch_probe" != "DIFFER" ]; then
            echo "::error::file swap is not live (expected base=EQUAL branch=DIFFER)"
            exit 1
          fi
          swap main
          set -x
          # Deliberately tiny: this step answers "does it run at all", and a
          # CPU forward is slow enough that the real workload belongs in the
          # benchmark step. One decode token is enough -- the preprocessing
          # stats this PR is about are recorded during prefill either way.
          timeout 1500 vllm bench mm-processor \
            --model "$MODEL" --dtype "$DTYPE" \
            --max-model-len 8192 --enforce-eager \
            --max-num-seqs 1 --max-num-batched-tokens 8192 \
            --dataset-name random-mm --num-prompts 1 --num-warmups 0 \
            --random-input-len 64 --random-output-len 1 \
            --random-mm-base-items-per-request 2 \
            --random-mm-limit-mm-per-prompt '{"image": 3, "video": 0}' \
            --random-mm-bucket-config '{(256, 256, 1): 0.7, (720, 1280, 1): 0.3}' \
            --seed 0 --disable-tqdm --metric-percentiles 50,99 \
            --output-json "$OUT/smoke.json" 2>&1 | tail -60
          echo "--- smoke.json ---"
          cat "$OUT/smoke.json"

      - name: Benchmark -- 1 discarded warmup + N measured repeats, alternating order
        if: ${{ env.SMOKE_ONLY != 'true' }}
        env:
          VLLM_CPU_KVCACHE_SPACE: "4"
          VLLM_ENABLE_V1_MULTIPROCESSING: "0"
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/venv/bin/activate"
          # Outside the checkout, so the wheel is what runs (see the install step).
          cd "$RUNNER_TEMP"

          run_side() {  # run_side <main|branch> <repeat>
            local side=$1 rep=$2 json="$OUT/${1}.r${2}.json"
            cp -f "$OUT/hasher.$side.py" "$INSTALLED_HASHER"
            find "$(dirname "$INSTALLED_HASHER")" -name '__pycache__' -type d \
              -prune -exec rm -rf {} + 2>/dev/null || true
            printf '   [r%s] %-6s ' "$rep" "$side"
            # Workload mirrors the documented Quick Start, with a fixed --seed so
            # both sides hash byte-identical media. Two images per request is
            # deliberate: the framing applies to sequence and mapping containers,
            # which a single item would barely exercise.
            local t0=$SECONDS
            # Two images per request is deliberate: the framing applies to
            # sequence and mapping containers, which one item barely exercises.
            # Output length is 1 -- decode is pure CPU cost that adds nothing to
            # the preprocessing stats this PR is about.
            if timeout 2400 vllm bench mm-processor \
                  --model "$MODEL" --dtype "$DTYPE" \
                  --max-model-len 8192 --enforce-eager \
                  --max-num-seqs 1 --max-num-batched-tokens 8192 \
                  --dataset-name random-mm \
                  --num-prompts "$NUM_PROMPTS" --num-warmups 1 \
                  --random-input-len 64 --random-output-len 1 \
                  --random-mm-base-items-per-request 2 \
                  --random-mm-limit-mm-per-prompt '{"image": 3, "video": 0}' \
                  --random-mm-bucket-config '{(256, 256, 1): 0.7, (720, 1280, 1): 0.3}' \
                  --seed 0 --disable-tqdm --metric-percentiles 50,99 \
                  --output-json "$json" > "$OUT/${side}.r${rep}.log" 2>&1; then
              echo "ok ($((SECONDS - t0))s)"
            else
              echo "ERROR"
              tail -30 "$OUT/${side}.r${rep}.log" >&2
              exit 1
            fi
          }

          for rep in $(seq 0 "$REPEATS"); do
            if [ $((rep % 2)) -eq 0 ]; then order="main branch"; else order="branch main"; fi
            extra=""; [ "$rep" = "0" ] && extra="  [warmup, discarded]"
            echo " repeat $rep  (order: $order)$extra"
            for side in $order; do run_side "$side" "$rep"; done
          done

      - name: Summary
        if: ${{ env.SMOKE_ONLY != 'true' }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/venv/bin/activate"
          export CPU_DESC="$(grep -m1 'Model name' /tmp/cpu.txt | sed 's/.*: *//')"
          python .github/bench/summarize_mm_processor.py | tee "$OUT/SUMMARY.txt"
          {
            echo '```'
            cat "$OUT/SUMMARY.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mm-processor-ab
          path: |
            ${{ env.OUT }}/*.json
            ${{ env.OUT }}/*.log
            ${{ env.OUT }}/SUMMARY.txt
          if-no-files-found: warn
