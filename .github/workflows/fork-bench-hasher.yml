name: fork-bench-hasher

# Fork-only. Microbenchmarks MultiModalHasher.hash_kwargs on main vs a branch.
# `vllm bench mm-processor` needs a GPU; this measures the `get_mm_hashes`
# stage of that benchmark directly, which is the only stage the hasher change
# can affect.
#
# The A/B pair is repeated REPEATS times and the per-case minimum is taken
# across repeats, so a noisy neighbour on the runner cannot masquerade as a
# regression. It also counts hasher.update() calls per case, which is the
# mechanical quantity the framing change actually moves.

on:
  push:
    branches:
      - ci/test-runner

env:
  BENCH_BRANCH: fix/mm-hash-framing
  REPEATS: "5"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install vLLM (precompiled, editable)
        run: |
          set -euxo pipefail
          uv venv --python 3.12
          source .venv/bin/activate
          VLLM_USE_PRECOMPILED=1 uv pip install -e . --torch-backend=auto
          python - <<'PY'
          import vllm.multimodal.hasher as h
          assert h.__file__.startswith("/home/runner/work/vllm/vllm/"), h.__file__
          print("editable install tracks the working tree: OK")
          PY

      - name: Write the benchmark
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          cat > "$RUNNER_TEMP/bench/bench_hasher.py" <<'PY'
          """Time MultiModalHasher.hash_kwargs on payloads shaped like real
          multi-modal requests. This is the `get_mm_hashes` stage of
          `vllm bench mm-processor` in isolation."""

          import gc
          import json
          import statistics
          import sys
          import time

          import numpy as np
          from PIL import Image

          import vllm.multimodal.hasher as hasher_mod
          from vllm.multimodal.hasher import MultiModalHasher

          ALGO = "sha256"
          MODEL = "Qwen/Qwen2-VL-7B-Instruct"
          KWARGS = {"min_pixels": 3136, "max_pixels": 12845056}


          def rgb(seed, n, h, w):
              rng = np.random.default_rng(seed)
              return rng.integers(0, 256, (n, h, w, 3), dtype=np.uint8)


          def pil(seed, h, w):
              return Image.fromarray(rgb(seed, 1, h, w)[0])


          def cases():
              for px, n in ((336, 512), (512, 256), (1024, 64), (2048, 16)):
                  yield f"image {px}x{px}", n, dict(image=pil(px, px, px), **KWARGS)
              yield "video ndarray 32x336x336", 32, dict(video=rgb(2, 32, 336, 336))
              yield (
                  "video 32 PIL frames",
                  32,
                  dict(video=[pil(3 + i, 336, 336) for i in range(32)]),
              )
              yield "audio 30s float32", 128, dict(audio=np.zeros(16000 * 30, np.float32))
              # No payload, maximal framing overhead per byte hashed: the shape
              # where this change costs the most, in relative terms.
              yield "kwargs only, 1000 nested ints", 32, dict(
                  nested={str(i): {"a": i, "b": [i, i + 1]} for i in range(1000)}
              )


          def count_updates(kwargs):
              """Number of hasher.update() calls and bytes fed, per hash_kwargs call."""
              calls = 0
              nbytes = 0
              real = hasher_mod._get_hasher_factory(ALGO)

              class Counting:
                  def __init__(self):
                      self._h = real()

                  def update(self, b):
                      nonlocal calls, nbytes
                      calls += 1
                      nbytes += b.nbytes if isinstance(b, memoryview) else len(b)
                      self._h.update(b)

                  def hexdigest(self):
                      return self._h.hexdigest()

              orig = hasher_mod._get_hasher_factory
              hasher_mod._get_hasher_factory = lambda algo: Counting
              try:
                  MultiModalHasher.hash_kwargs(ALGO, model_id=MODEL, **kwargs)
              finally:
                  hasher_mod._get_hasher_factory = orig
              return calls, nbytes


          def bench(kwargs, n, rounds=15):
              """Report the MINIMUM per-call time over `rounds` batches of `n`.

              `n` is fixed per case rather than auto-calibrated, so both
              revisions do identical total work. The minimum is used because
              interference from a noisy neighbour on a shared runner can only
              ever make a sample slower; the median moves under load, the
              minimum does not.
              """
              hash_kwargs = MultiModalHasher.hash_kwargs
              hash_kwargs(ALGO, model_id=MODEL, **kwargs)

              per_call = []
              gc.disable()
              try:
                  for _ in range(rounds):
                      t0 = time.perf_counter_ns()
                      for _ in range(n):
                          hash_kwargs(ALGO, model_id=MODEL, **kwargs)
                      per_call.append((time.perf_counter_ns() - t0) / n / 1e6)
              finally:
                  gc.enable()
              return {
                  "ms": min(per_call),
                  "median_ms": statistics.median(per_call),
                  "n": n,
                  "rounds": per_call,
              }


          out = {}
          for name, n, kwargs in cases():
              r = bench(kwargs, n)
              r["updates"], r["bytes"] = count_updates(kwargs)
              out[name] = r
              print(
                  f"{name:32s} {r['ms']:10.4f} ms/call  "
                  f"(n={r['n']}, {r['updates']} updates, {r['bytes']} bytes)",
                  flush=True,
              )

          with open(sys.argv[1], "w") as f:
              json.dump(out, f, indent=2)
          PY
          cat > "$RUNNER_TEMP/bench/compare.py" <<'PY'
          import json
          import pathlib
          import statistics
          import sys

          d = pathlib.Path(sys.argv[1])
          branch = sys.argv[2].replace("/", "_")


          def load(tag):
              runs = sorted(d.glob(f"{tag}.r*.json"))
              per = [json.loads(p.read_text()) for p in runs]
              cases = per[0].keys()
              return (
                  {k: min(r[k]["ms"] for r in per) for k in cases},
                  {k: per[0][k]["updates"] for k in cases},
                  {k: per[0][k]["bytes"] for k in cases},
                  {k: [round(r[k]["ms"], 4) for r in per] for k in cases},
                  len(per),
              )


          a, ua, ba, ra, na = load("main")
          b, ub, bb, rb, nb = load(branch)

          print("")
          print(f"=========== main vs branch (min over {na}/{nb} A/B repeats) ===========")
          hdr = f"{'case':30s} {'main ms':>9s} {'branch ms':>10s} {'delta':>8s}"
          hdr += f" {'updates m>b':>13s} {'bytes m>b':>19s}"
          print(hdr)
          for k in a:
              m, n = a[k], b[k]
              print(
                  f"{k:30s} {m:9.4f} {n:10.4f} {(n / m - 1) * 100:+7.1f}%"
                  f" {ua[k]:6d} > {ub[k]:4d} {ba[k]:9d} > {bb[k]:9d}"
              )
          print("")
          print("per-repeat minima (ms), to show run-to-run spread on a shared runner:")
          for k in a:
              print(f"  {k:30s} main {ra[k]}   branch {rb[k]}")
          PY

      - name: Run interleaved A/B repeats
        run: |
          set -uo pipefail
          source .venv/bin/activate
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          OUT="$GITHUB_WORKSPACE/bench.txt"
          : > "$OUT"

          for i in $(seq 1 "$REPEATS"); do
            for ref in main "$BENCH_BRANCH"; do
              git checkout -f -q "origin/$ref"
              tag=$(echo "$ref" | tr / _)
              {
                echo ""
                echo "=========== repeat $i :: $ref ==========="
                echo "HEAD = $(git rev-parse --short HEAD)  ($(git log -1 --pretty=%s))"
              } | tee -a "$OUT"
              python "$RUNNER_TEMP/bench/bench_hasher.py" \
                "$RUNNER_TEMP/bench/$tag.r$i.json" 2>&1 | tee -a "$OUT"
            done
          done

          git checkout -f -q origin/main
          python "$RUNNER_TEMP/bench/compare.py" \
            "$RUNNER_TEMP/bench" "$BENCH_BRANCH" 2>&1 | tee -a "$OUT"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench.txt
          if-no-files-found: warn
